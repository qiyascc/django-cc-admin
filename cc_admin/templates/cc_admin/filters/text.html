{% load i18n cc_admin %}
<details class="cc-filter cc-filter-input" data-filter-title="{{ title }}" open>
  <summary>{{ title|capfirst }}</summary>
  <label class="cc-input-icon">{% icon "search" %}<input type="{{ spec.input_type|default:'text' }}" step="any" name="{{ spec.parameter_name }}" value="{{ spec.value|default:'' }}" placeholder="{% if spec.input_type == 'number' %}{% translate 'Equals…' %}{% else %}{% translate 'Contains…' %}{% endif %}"></label>
</details>
