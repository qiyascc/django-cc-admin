{% load cc_admin %}{% for action in actions %}{% if action.group %}<div class="cc-dropdown" data-menu>
  <button type="button" class="cc-btn cc-btn-{{ action.variant }}" data-menu-toggle>{% if action.icon %}{% icon action.icon %}{% endif %}<span>{{ action.label }}</span>{% icon "chevron-down" "cc-caret" %}</button>
  <div class="cc-menu cc-menu-right" role="menu">{% for item in action.items %}<button type="submit" form="cc-action-form" formaction="{{ item.url }}" class="cc-menu-item cc-tone-{{ item.variant }}" role="menuitem"{% if item.confirm %} data-confirm="{{ item.confirm }}"{% endif %}{% if item.new_tab %} formtarget="_blank"{% endif %}>{% if item.icon %}{% icon item.icon %}{% endif %}<span>{{ item.label }}</span></button>{% endfor %}</div>
</div>{% else %}<button type="submit" form="cc-action-form" formaction="{{ action.url }}" class="cc-btn cc-btn-{{ action.variant }}"{% if action.confirm %} data-confirm="{{ action.confirm }}"{% endif %}{% if action.new_tab %} formtarget="_blank"{% endif %}>{% if action.icon %}{% icon action.icon %}{% endif %}<span>{{ action.label }}</span></button>{% endif %}{% endfor %}
