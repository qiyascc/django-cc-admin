[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "django-cc-admin"
version = "0.1.0"
description = "A modern skin and toolkit for the Django admin: 15 themes, a dashboard built from settings, live updates, notifications, a command palette and keyboard-first lists."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Qiyas Sadıqov", email = "qiyasturk@gmail.com" }]
keywords = ["django", "admin", "theme", "dashboard", "django-admin"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.0",
    "Framework :: Django :: 5.1",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]
dependencies = ["Django>=5.0"]

[project.optional-dependencies]
live = ["channels>=4.0", "daphne>=4.0"]
push = ["pywebpush>=2.0"]
all = ["channels>=4.0", "daphne>=4.0", "pywebpush>=2.0"]

[project.urls]
Homepage = "https://github.com/qiyascc/django-cc-admin"
Documentation = "https://django-cc-admin.readthedocs.io/"
Source = "https://github.com/qiyascc/django-cc-admin"
Issues = "https://github.com/qiyascc/django-cc-admin/issues"
Author = "https://theqiyas.cc"

[tool.hatch.build.targets.wheel]
packages = ["cc_admin"]

[tool.hatch.build.targets.sdist]
include = ["cc_admin", "README.md", "LICENSE", "NOTICE"]
